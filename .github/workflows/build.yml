name: Build engine

on:
  # Nightly, and only when main has commits the last nightly did not build.
  schedule:
    - cron: "0 19 * * *"
  workflow_call:
  workflow_dispatch:
    inputs:
      capture-scenes:
        description: "Optional comma-separated procedural scenes to capture instead of staging"
        type: string
        default: ""
      target:
        description: "Build target"
        required: false
        type: choice
        default: all
        options:
          - all
          - sdl-windows-x86-runtime
          - sdl-windows-x64-runtime
          - sdl-windows-arm64-runtime
          - sdl-linux-x64-runtime
          - sdl-linux-arm64-runtime
          - sdl-macos-x64-runtime
          - sdl-macos-arm64-runtime
          - sdl-windows-x86-static
          - sdl-windows-x64-static
          - sdl-windows-arm64-static
          - sdl-linux-x64-static
          - sdl-linux-arm64-static
          - sdl-macos-x64-static
          - sdl-macos-arm64-static

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select changed modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
      test: ${{ steps.scope.outputs.test }}
      selection: ${{ steps.scope.outputs.selection }}
      compile: ${{ steps.scope.outputs.compile }}
      modules: ${{ steps.scope.outputs.modules }}
      scripts: ${{ steps.scope.outputs.scripts }}
      layout: ${{ steps.scope.outputs.layout }}
      cache_scope: ${{ steps.scope.outputs.cache_scope }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0
    - name: Compare source revisions
      id: scope
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        TARGET: ${{ inputs.target || 'all' }}
        CAPTURE_SCENES: ${{ inputs.capture-scenes }}
        MODULES: changed
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -n "$CAPTURE_SCENES" ] && [[ "$TARGET" != *-runtime ]]; then
          echo "Scene capture requires one explicit runtime target" >&2
          exit 1
        fi
        if [ "$GITHUB_EVENT_NAME" = schedule ]; then
          BASE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --event schedule --limit 30 \
            --json headSha,conclusion --jq 'map(select(.conclusion == "success" or .conclusion == "failure"))[0].headSha // ""')
        fi
        python3 -B .github/scripts/engine_ci.py select --base "$BASE" --modules "$MODULES" --target "$TARGET"

  build:
    name: sdl-${{ matrix.platform.name }}-${{ matrix.linkage.name }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name != 'schedule' || needs.changes.outputs.build == 'true') }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CAPTURE_SCENES: ${{ inputs.capture-scenes }}
      CKRE_SDL_GPU_DRIVER: ${{ startsWith(matrix.platform.name, 'windows-') && 'direct3d12' || startsWith(matrix.platform.name, 'linux-') && 'vulkan' || 'metal' }}
      SDL_VIDEODRIVER: ${{ startsWith(matrix.platform.name, 'linux-') && 'x11' || '' }}

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      uses: actions/checkout@v6.0.2

    - name: Checkout submodules
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: ./cmake/UpdateSubmodules.ps1

    - name: Setup current wayland-scanner
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) && startsWith(matrix.platform.name, 'linux-') }}
      shell: bash
      run: ./cmake/SetupWaylandScanner.sh

    - name: Setup SDL3
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      id: sdl
      uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
      with:
        version: 3.4.20
        cmake-generator: ${{ matrix.platform.sdl_cmake_generator }}
        cmake-arguments: ${{ matrix.platform.sdl_cmake_arguments }}
        discriminator: ${{ matrix.platform.sdl_discriminator }}
        build-type: Release
        install-linux-dependencies: true

    - name: Prepare build cache key
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name)) }}
      id: cache-key
      run: |
        $imageVersion = $env:ImageVersion
        "prefix=nemo-build-v2-${{ matrix.platform.name }}-${{ matrix.linkage.name }}-${imageVersion}-sdl3.4.20-${{ hashFiles('CMakePresets.json', 'cmake/NeMo2Compiler.cmake', 'cmake/NeMo2LinkCache.cmake') }}-" >> $env:GITHUB_OUTPUT
        "legacy-test=nemo-test-v1-${{ matrix.platform.name }}-${{ matrix.linkage.name }}-${imageVersion}-" >> $env:GITHUB_OUTPUT
        "legacy-build=nemo-build-v1-${{ matrix.platform.name }}-${{ matrix.linkage.name }}-${imageVersion}-" >> $env:GITHUB_OUTPUT

    - name: Restore incremental build
      if: ${{ steps.cache-key.outcome == 'success' }}
      id: build-cache
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}
        key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}-build
        restore-keys: |
          ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}-
          ${{ steps.cache-key.outputs.prefix }}
          ${{ steps.cache-key.outputs.legacy-test }}
          ${{ steps.cache-key.outputs.legacy-build }}

    - name: Restore unchanged source timestamps
      if: ${{ steps.cache-key.outcome == 'success' }}
      run: python3 -B .github/scripts/build_cache_state.py restore --build-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}

    - name: Configure
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        $tools = $env:CAPTURE_SCENES ? 'ON' : 'OFF'
        $sdk = ($IsWindows -and $env:CAPTURE_SCENES) ? '620' : '0'
        cmake --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }} `
          ${{ matrix.platform.configure_arguments }} `
          "-DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}" `
          -DBUILD_TESTING=OFF -DNEMO_BUILD_TESTS=OFF `
          -DVXMATH_BUILD_TESTS=OFF -DCK2_BUILD_TESTS=OFF -DCKRE_BUILD_TESTS=OFF `
          -DCKBB_BUILD_TESTS=OFF -DCKPLUGINS_BUILD_TESTS=OFF -DIVP_BUILD_TESTS=OFF `
          "-DCKRE_BUILD_TOOLS=$tools" `
          "-DCKRE_SCENE_CAPTURE_D3D12_SDK_VERSION=$sdk" `
          -DVXMATH_BUILD_STATIC=${{ matrix.linkage.build_static }} `
          -DCK2_BUILD_STATIC=${{ matrix.linkage.build_static }} `
          -DCKRE_BUILD_STATIC=${{ matrix.linkage.build_static }}

    - name: Build
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == format('sdl-{0}-{1}', matrix.platform.name, matrix.linkage.name) }}
      run: |
        if ($env:CAPTURE_SCENES) {
          if ('${{ matrix.linkage.name }}' -ne 'runtime') { throw 'Scene capture requires runtime linkage' }
          cmake --build build/${{ matrix.platform.preset }}-runtime --config Release --target ckre_scene_capture CK2_3D CKSdlGpuRasterizer --parallel $([Environment]::ProcessorCount)
        } else {
          cmake --build --preset ${{ matrix.platform.preset }}-${{ matrix.linkage.name }}-stage-release --parallel $([Environment]::ProcessorCount)
        }

    - name: Save source timestamps for incremental builds
      if: ${{ !cancelled() && steps.cache-key.outcome == 'success' }}
      run: python3 -B .github/scripts/build_cache_state.py save --build-dir build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}

    - name: Save incremental build
      if: ${{ !cancelled() && steps.cache-key.outcome == 'success' && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: build/${{ matrix.platform.preset }}-${{ matrix.linkage.name }}
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    - name: Setup scene capture on Linux
      if: ${{ env.CAPTURE_SCENES != '' && startsWith(matrix.platform.name, 'linux-') }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb mesa-vulkan-drivers

    - name: Setup scene capture on Windows
      if: ${{ env.CAPTURE_SCENES != '' && startsWith(matrix.platform.name, 'windows-') }}
      run: |
        $binary = (Resolve-Path 'build/${{ matrix.platform.preset }}-runtime/bin/Release').Path
        $architecture = '${{ matrix.platform.name }}'.Substring(8)
        ./cmake/SetupWindowsWarp.ps1 -Architecture $architecture -DestinationDirectory $binary
        ./cmake/SetupWindowsD3D12.ps1 -Architecture $architecture -DestinationDirectory "$binary/D3D12"
        & "$binary/D3D12/d3dconfig.exe" apps --add "$binary/ckre_scene_capture.exe"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "$binary/D3D12/d3dconfig.exe" device force-warp=true
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Capture selected procedural scenes
      if: ${{ env.CAPTURE_SCENES != '' }}
      timeout-minutes: 3
      run: |
        $root = (Resolve-Path 'build/${{ matrix.platform.preset }}-runtime').Path
        $tool = "$root/bin/ckre_scene_capture"
        $engine = "$root/lib"
        if ($IsWindows) {
          $tool = "$root/bin/Release/ckre_scene_capture.exe"
          $engine = "$root/bin/Release"
        }
        Remove-Item -LiteralPath "$root/scene-references" -Recurse -Force -ErrorAction SilentlyContinue
        $output = New-Item -ItemType Directory -Force -Path "$root/scene-references"
        foreach ($scene in $env:CAPTURE_SCENES.Split(',')) {
          if ($scene -notmatch '^[a-z0-9_]+$') { throw 'Invalid scene name' }
          $arguments = @('--render-engine-dir', $engine, '--rasterizer', 'sdlgpu', '--scene', $scene, '--size', '640x480', '--frames', '5', '--out', $output.FullName)
          if ($IsLinux) { xvfb-run -a $tool @arguments 2>&1 | Tee-Object -FilePath "$output/$scene.log" }
          else { & $tool @arguments 2>&1 | Tee-Object -FilePath "$output/$scene.log" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        git -C Source/RenderEngine rev-parse HEAD > "$output/scene-revision.txt"

    - name: Upload scene references for review
      if: ${{ env.CAPTURE_SCENES != '' && !cancelled() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: scene-references-${{ matrix.platform.name }}
        path: build/${{ matrix.platform.preset }}-runtime/scene-references/
        if-no-files-found: error


  test:
    name: Test nightly build
    needs: [changes, build]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.changes.outputs.test == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/test.yml
    with:
      selection: ${{ needs.changes.outputs.selection }}
